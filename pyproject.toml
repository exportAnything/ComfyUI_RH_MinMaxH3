[project]
name = "comfyui-minimax-h3-direct"
version = "0.3.0"
description = "Direct, in-process MiniMax-H3 audio-video custom nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "transformers==5.8.1",
  "accelerate>=1.11.0",
  "safetensors>=0.4.5",
  "numpy>=1.26",
  "sentencepiece>=0.2.0",
  "einops>=0.7.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
cache-dit = ["cache-dit>=1.3.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.comfy]
PublisherId = "yanghao"
DisplayName = "RunningHub MiniMax H3 Direct"
Icon = ""
includes = ["examples"]
