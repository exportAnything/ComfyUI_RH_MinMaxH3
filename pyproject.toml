[project]
name = "comfyui-minimax-h3-direct"
version = "0.2.1"
description = "Direct, in-process MiniMax-H3 audio-video custom nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "transformers==5.8.1",
  "accelerate>=1.11.0",
  "safetensors>=0.4.5",
  "numpy>=1.26",
  "sentencepiece>=0.2.0",
  "einops>=0.7.0",
  "Pillow>=10.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
