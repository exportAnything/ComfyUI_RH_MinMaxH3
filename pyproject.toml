[project]
name = "comfyui-rh-minimax-h3"
version = "0.6.1"
description = "RunningHub MiniMax-H3 audio-video custom nodes for ComfyUI (direct, in-process)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "transformers>=4.57.0",
  "accelerate>=1.11.0",
  "safetensors>=0.4.5",
  "numpy>=1.26",
  "sentencepiece>=0.2.0",
  "einops>=0.7.0",
  "Pillow>=10.0.0",
]

[project.urls]
Repository = "https://github.com/exportAnything/ComfyUI_RH_MinMaxH3"

[project.optional-dependencies]
cache-dit = ["cache-dit>=1.3.0"]

[tool.ruff]
line-length = 100
target-version = "py310"


[tool.comfy]
PublisherId = "yanghao"
DisplayName = "RunningHub MiniMax H3"
Icon = ""
includes = ["examples"]
